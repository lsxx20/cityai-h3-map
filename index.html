.legend {

  const mapEl = document.getElementById("map");
  const vp = new deck.WebMercatorViewport({ width: mapEl.clientWidth || 800, height: mapEl.clientHeight || 600 })
    .fitBounds([[119.95, 21.85], [122.05, 25.35]], { padding: 24 });
  state.zoom = vp.zoom;
  // 目前畫的資料：[{ gid, cells }]。畫點時整檔一組（教育程度一個檔一組）；畫六角形時一塊一組，移動地圖時沒變的塊不用重算
  let groups = null;
  let vs = { longitude: vp.longitude, latitude: vp.latitude, zoom: vp.zoom };
  // 畫面的經緯度範圍，四周多留 pad 倍，且至少 minKm 公里
  const viewBox = (pad, minKm = 0) => {
    const v = new deck.WebMercatorViewport({ width: mapEl.clientWidth || 800, height: mapEl.clientHeight || 600, ...vs });
    const [w, s, e, n] = v.getBounds();
    const dx = Math.max((e - w) * pad, minKm / kmLng((s + n) / 2)), dy = Math.max((n - s) * pad, minKm / KM_LAT);
    return [w - dx, s - dy, e + dx, n + dy];
  };
  let timer = null;
  // res 9、10：移動地圖後重新看要讀哪些檔、畫哪些塊。res 7、8：只有在點和六角形之間切換時才重畫
  const later = () => { clearTimeout(timer); timer = setTimeout(refresh, tiled() ? 200 : 60); };
  const dk = new deck.DeckGL({
    container: "map",
    initialViewState: { ...vs, minZoom: 5, maxZoom: 16 },
    controller: { dragRotate: false, touchRotate: false },
    onViewStateChange: ({ viewState }) => {
      vs = { longitude: viewState.longitude, latitude: viewState.latitude, zoom: viewState.zoom };
      state.zoom = vs.zoom;
      if (tiled() || (groups && modeFor(state.res, state.zoom) !== state.mode)) later();
    },
    getTooltip: ({ object }) => object && object.id ? {
      html: `<div style="font-variant-numeric:tabular-nums;line-height:1.6">` +
        [t().cell(object.id, state.res)].concat(dt().tip(object, fmt, dt()))
          .map((line, k) => `<div${k === 0 ? ' style="opacity:.75"' : ""}>${line}</div>`).join("") + `</div>`,
      style: { background: css("--panel"), color: css("--fg"), border: `1px solid ${css("--line")}`,
        borderRadius: "6px", fontSize: "12px", padding: "8px 10px", fontFamily: css("--font") },
    } : null,
  });

  window.__cityaiDeck = dk; // 測試時用來把經緯度換成畫面位置

  function fillMetricOptions() {
    const sel = document.getElementById("metric");
    sel.innerHTML = DS[state.ds].metrics.map((m) => `<option value="${m}">${dt().m[m]}</option>`).join("");
    sel.value = state.metric[state.ds];
    sel.disabled = DS[state.ds].metrics.length === 1;
  }
  function applyText() {
    const L = t();
    document.documentElement.lang = L.htmlLang;
    document.title = L.page;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = L[el.dataset.t]; });
    document.getElementById("title").textContent = dt().title;
    document.getElementById("source").textContent = dt().source;
    document.querySelectorAll("#ds option").forEach((o) => { o.textContent = L.ds[o.value].name; });
    document.getElementById("ds").value = state.ds;
    fillMetricOptions();
    document.querySelectorAll("#lang-group button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    document.querySelectorAll("#res-group button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.res === state.res)));
  }

  // 畫圖：格子小到看不清楚、或畫面裡格子太多時，在格子中心畫點；其他時候畫六角形（用每格實際的邊界畫，格子之間不會有縫）。
  // 每組資料的圖層只在第一次用到時建，之後移動地圖不重算；另一種畫法最近一次的圖層先藏起來留著，在點和六角形之間切換時不用重建。
  // 分級和顏色只在換資料、解析度、欄位或深淺色時重算；每組資料「要畫的格子」也只篩一次
  let prep = null;
  const shownCache = new WeakMap(); // 格子陣列 → { 欄位: 要畫的格子 }，原本的格子陣列不用了就一起清掉
  function shownOf(cells, sk) {
    let m = shownCache.get(cells);
    if (!m) shownCache.set(cells, (m = {}));
    return m[sk] || (m[sk] = cells.filter((c) => c[sk] > 0));
  }
  function prepare() {
    const m = state.metric[state.ds];
    const key = [state.ds, state.res, m, isDark()].join("|");
    if (prep && prep.key === key) return prep;
    const sk = DS[state.ds].show ? DS[state.ds].show[m] : m;
    const s = SUMMARY[state.ds][state.res];
    const preset = s.bins && s.bins[m];
    const kind = DS[state.ds].kind[m];
    // 沒有事先算好切點的（交通事故）用整檔的值算，不用畫面內的，移動地圖時圖例才不會變
    const values = preset || kind === "share" ? [] : fullCells.filter((c) => c[sk] > 0).map((c) => c[m]);
    const cl = classes(values, kind, preset);
    const colors = binColors(cl.bins.length, isDark() ? RAMP_DARK : RAMP_LIGHT).map(rgb);
    return (prep = { key, m, sk, cl, colors });
  }

  let stash = { key: "", dot: [], hex: [] }; // 各畫法最近一次畫的組
  function draw() {
    const { m, sk, cl, colors } = prepare();
    const countyColor = rgb(css("--county"));
    const few = DS[state.ds].few && DS[state.ds].few[m];
    const fewColor = rgb(css("--few"));
    const fill = (c) => (few && c.a < few ? fewColor : colors[binOf(cl, c[m])]);
    const sKey = `${state.ds}${state.res}|${sk}`;
    if (stash.key !== sKey) stash = { key: sKey, dot: [], hex: [] };
    stash[state.mode] = groups;
    const cellLayers = [];
    for (const mode of ["dot", "hex"]) for (const g of stash[mode]) {
      const on = mode === state.mode;
      const common = { id: `${mode}-${g.gid}-${sk}`, data: shownOf(g.cells, sk), getFillColor: fill,
        updateTriggers: { getFillColor: [prep.key] }, visible: on, pickable: on, autoHighlight: true, highlightColor: [255, 170, 0, 180] };
      cellLayers.push(mode === "hex"
        ? new deck.SolidPolygonLayer({ ...common, getPolygon: polyOf })
        : new deck.ScatterplotLayer({ ...common, getPosition: posOf, getRadius: EDGE_M[state.res] * DOT_R,
            radiusUnits: "meters", radiusMinPixels: 1.2 }));
    }
    dk.setProps({
      layers: [
        ...cellLayers,
        new deck.PathLayer({
          id: "county", data: COUNTY, getPath: (p) => p, getColor: countyColor, getWidth: 1,
          widthUnits: "pixels", widthMinPixels: 1, updateTriggers: { getColor: [countyColor.join()] },
        }),
      ],
    });

    const L = t();
    const name = (dt().legend || dt().m)[m];
    const s = SUMMARY[state.ds][state.res];
    const note = dt().note && dt().note[m];
    document.getElementById("legend").innerHTML =
      `<h2>${L.head(name, state.res, L.area[state.res])}</h2><ul>` +
      labels(cl, unitOf(m)).map((x, k) => `<li><i style="background:rgb(${colors[k].join(",")})"></i>${x}</li>`).join("") +
      (few ? `<li><i style="background:rgb(${fewColor.join(",")})"></i>${L.few(few)}</li>` : "") +
      `</ul>` + (state.far ? `<p>${L.far(state.res)}</p>` : state.mode === "dot" ? `<p>${L.zoom}</p>` : "") +
      (note ? `<p>${typeof note === "function" ? note(s, fmt) : note}</p>` : "");
    document.getElementById("summary").textContent = dt().summary(s, state.res, fmt);
    try { localStorage.setItem("cityai-map", JSON.stringify({ ds: state.ds, res: state.res, metric: state.metric, lang: state.lang })); } catch (e) {}
    hintEl.textContent = state.far ? L.far(state.res) : "";
    hintEl.hidden = !state.far;
  }

  // 換資料或解析度時讀檔；res 9、10 在移動地圖後也會呼叫，看要讀哪些檔、畫哪些塊。讀檔中又換了，就只畫最後選的那一個
  let ticket = 0;
  let shownKey = "";
  let fullCells = []; // 整檔的格子（交通事故用整檔的值算分級）；教育程度 res 9、10 分檔，不用
  const loadingEl = document.getElementById("loading");
  const hintEl = document.getElementById("hint");
  const showLoading = (text) => { loadingEl.textContent = text; loadingEl.hidden = false; };
  async function update(my) {
    const ds = state.ds, res = state.res;
    const files = Boolean(DS[ds].chunkFiles) && tiled(); // 教育程度只有 res 9、10 分檔
    let full = null;
    if (!files) {
      if (!(tiled() ? tileCache[ds + res] : cache[ds + res])) {
        showLoading(t().loading);
        await new Promise((r) => setTimeout(r, 20));
      }
      full = tiled() ? await loadTiles(ds, res) : { cells: await loadFile(ds, res) };
      if (my !== ticket) return;
      fullCells = full.cells;
    }
    let mode = modeFor(res, state.zoom), far = false, next;
    if (!tiled()) next = [{ gid: `${ds}${res}`, cells: fullCells }];
    else {
      // 先備好資料：建物、事故是整個檔一份；教育程度是畫面需要的每個檔各一份
      let pieces = [{ gid: `${ds}${res}`, ...full }];
      if (files) {
        const all = EDU_FILES[res];
        let need = parentsInView(FILE_RES[res], all, 4 * MAX_FILES[res]);
        if (!need && all.size <= MAX_FILES[res]) need = [...all].sort(); // 拉得很遠、檔又不多（res 9）時全部讀
        if (!need || need.length > MAX_FILES[res]) { far = true; pieces = []; }
        else {
          if (need.some((p) => !tileCache[chunkKey(ds, res, p)])) showLoading(t().loadingCells);
          const got = await Promise.all(need.map((p) => loadChunkTiles(ds, res, p)));
          if (my !== ticket) return;
          const now = performance.now();
          need.forEach((p, k) => chunkInfo.set(chunkKey(ds, res, p), { n: got[k].cells.length, t: now }));
          evictChunks(new Set(need.map((p) => chunkKey(ds, res, p))));
          pieces = need.map((p, k) => ({ gid: `${ds}${res}/f${p}`, ...got[k] }));
        }
      }
      // 夠大可以畫六角形時，找畫面碰到的塊；格子不多才畫六角形，不然畫點
      let tiles = null;
      if (mode === "hex" && pieces.length) {
        const m = new Map();
        for (const pc of pieces) for (const [p, cells] of pc.m) m.set(p, cells);
        const need = parentsInView(TILE[res], m, MAX_SCAN);
        if (need && need.reduce((n, p) => n + m.get(p).length, 0) <= MAX_HEX_CELLS) {
          tiles = need.map((p) => ({ gid: `${ds}${res}/${p}`, cells: m.get(p) }));
        }
      }
      if (tiles) next = tiles;
      else { mode = "dot"; next = pieces.map((pc) => ({ gid: pc.gid, cells: pc.cells })); }
    }
    const key = `${ds}${res}:${mode}:${far}:${next.map((g) => g.gid).join(",")}`;
    state.mode = mode;
    state.far = far;
    groups = next;
    if (key !== shownKey) { shownKey = key; draw(); }
    loadingEl.hidden = true;
  }
  // 讀檔失敗時不要一直停在「讀取中」：顯示沒讀到，過幾秒自動再試，最多 3 次；之後移動地圖或換資料時也會再試
  let retryTimer = null, retries = 0;
  async function refresh() {
    const my = ++ticket;
    clearTimeout(retryTimer);
    try {
      await update(my);
      if (my === ticket) retries = 0;
    } catch (e) {
      if (my !== ticket) return;
      console.error(e);
      shownKey = "";
      const again = retries < 3;
      showLoading(again ? t().loadRetry : t().loadFail);
      if (again) { retries++; retryTimer = setTimeout(refresh, 3000); }
    }
  }

  document.getElementById("ds").addEventListener("change", (e) => { state.ds = e.target.value; applyText(); refresh(); });
  document.getElementById("res-group").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-res]");
    if (!b) return;
    state.res = +b.dataset.res;
    applyText();
    refresh();
  });
  document.getElementById("lang-group").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-lang]");
    if (!b) return;
    state.lang = b.dataset.lang;
    applyText();
    if (groups) draw();
  });
  document.getElementById("metric").addEventListener("change", (e) => { state.metric[state.ds] = e.target.value; if (groups) draw(); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => groups && draw());
  new MutationObserver(() => groups && draw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  applyText();
  refresh();
})();
</script>

</body></html>
